name: Deploy dos contratos (automático)

# Cria uma chave de deploy DESCARTÁVEL dentro do próprio runner (não fica guardada em lugar nenhum),
# mostra o endereço no resumo da execução, espera esse endereço receber POL, implanta, verifica o
# código no Sourcify, grava wallet/src/deployments/<chainId>.json na main, republica o site e
# devolve o POL que sobrar para o CREATOR_TREASURY (mesmo se algo falhar). A chave não tem nenhum
# poder depois do deploy: o dono da Reserva é o CREATOR_TREASURY desde o construtor.

on:
  workflow_dispatch:
    inputs:
      rede:
        description: "Rede"
        type: choice
        options: [polygon, amoy]
        default: polygon
      saldo_minimo_pol:
        description: "Começa quando a carteira de deploy tiver pelo menos este saldo (POL)"
        default: "2"
      espera_max_minutos:
        description: "Quanto tempo esperar o saldo chegar (máx. 340)"
        default: "340"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: deploy-${{ inputs.rede }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TREASURY: "0x2F8Fe2689411Bb336301AD4f2DC4077D433F43d1"
      FABRICA: "0x4e59b44847b379578588920cA78FbF26c0B4956C"
      POLYGON_RPC_URL: https://polygon-bor-rpc.publicnode.com
      AMOY_RPC_URL: https://polygon-amoy-bor-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.10.0

      - name: Criar chave descartável
        run: |
          # Compatível com os dois formatos do cast (lista simples ou envelope {data: [...]}).
          chave=$(cast wallet new --json | jq -r '(.data // .) | (if type == "array" then .[0] else . end) | .private_key')
          test -n "$chave" && test "$chave" != "null" || { echo "::error::Não foi possível criar a chave"; exit 1; }
          echo "::add-mask::$chave"
          echo "CHAVE=$chave" >> "$GITHUB_ENV"
          end=$(cast wallet address "$chave")
          echo "### Envie ${{ inputs.saldo_minimo_pol }} POL (rede ${{ inputs.rede }}) para: \`$end\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Carteira de deploy::$end"
          echo "DEPLOYER_AVISO=$end" >> "$GITHUB_ENV"

      - name: Avisar no GitHub (issue) o endereço que precisa de POL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create -R "$GITHUB_REPOSITORY" \
            --title "⛽ Deploy ${{ inputs.rede }}: envie ${{ inputs.saldo_minimo_pol }} POL para $DEPLOYER_AVISO" \
            --body "Rede: **${{ inputs.rede }}**. Envie **${{ inputs.saldo_minimo_pol }} POL** para \`$DEPLOYER_AVISO\`. O deploy começa sozinho quando o saldo chegar e o POL que sobrar volta para o CREATOR_TREASURY. Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "ISSUE_URL=$url" >> "$GITHUB_ENV"

      - name: Preparar rede
        run: |
          if [ "${{ inputs.rede }}" = "polygon" ]; then
            echo "RPC=$POLYGON_RPC_URL" >> "$GITHUB_ENV"; echo "CHAIN=137" >> "$GITHUB_ENV"; echo "GORJETA=40gwei" >> "$GITHUB_ENV"
          else
            echo "RPC=$AMOY_RPC_URL" >> "$GITHUB_ENV"; echo "CHAIN=80002" >> "$GITHUB_ENV"; echo "GORJETA=30gwei" >> "$GITHUB_ENV"
          fi
          echo "DEPLOYER=$(cast wallet address "$CHAVE")" >> "$GITHUB_ENV"

      - name: Pré-checagem on-chain
        run: |
          echo "Carteira de deploy: $DEPLOYER"
          test "$(cast chain-id --rpc-url "$RPC")" = "$CHAIN" || { echo "::error::RPC na rede errada"; exit 1; }
          test "$(cast code "$FABRICA" --rpc-url "$RPC")" != "0x" || { echo "::error::Fábrica CREATE2 ausente"; exit 1; }
          if [ "$CHAIN" = "137" ]; then
            for t in 0x4eD141110F6EeeAbA9A1df36d8c26f684d2475Dc 0xE6A537a407488807F0bbeb0038B79004f19DDDFb 0x5C067C80C00eCd2345b05E83A3e758eF799C40B5; do
              d=$(cast call "$t" "decimals()(uint8)" --rpc-url "$RPC"); s=$(cast call "$t" "symbol()(string)" --rpc-url "$RPC")
              echo "Lastro $t = $s ($d casas)"
            done
          fi

      - name: Simulação completa na rede real (sem gastar nada)
        working-directory: contracts
        env:
          XBRL_GRAVAR_JSON: "false"
        run: |
          # Roda o script inteiro contra um fork da rede: confere feeds Chainlink (nome, casas, preço, atualização),
          # lastros, pools da Uniswap e o próprio deploy. Se algo estiver errado, para aqui sem gastar POL.
          forge script script/DeployPolygon.s.sol:DeployPolygon --fork-url "$RPC" --sender "$DEPLOYER"

      - name: Testes antes de implantar
        working-directory: contracts
        run: forge test

      - name: Aguardar POL na carteira de deploy
        run: |
          minimo=$(cast to-wei "${{ inputs.saldo_minimo_pol }}")
          limite=$(( $(date +%s) + ${{ inputs.espera_max_minutos }} * 60 ))
          while true; do
            saldo=$(cast balance "$DEPLOYER" --rpc-url "$RPC" || echo 0)
            echo "$(date -u +%H:%M:%S) saldo: $(cast from-wei "$saldo") POL (precisa ${{ inputs.saldo_minimo_pol }})"
            if [ "$(echo "$saldo >= $minimo" | bc)" = "1" ]; then break; fi
            if [ "$(date +%s)" -ge "$limite" ]; then echo "::error::Saldo não chegou a tempo. Envie POL para $DEPLOYER e rode de novo."; exit 1; fi
            sleep 60
          done

      - name: Implantar (CREATE2 determinístico)
        working-directory: contracts
        run: |
          forge script script/DeployPolygon.s.sol:DeployPolygon --rpc-url "$RPC" --private-key "$CHAVE" \
            --broadcast --slow --priority-gas-price "$GORJETA"
          cat "../wallet/src/deployments/$CHAIN.json"

      - name: Verificar código-fonte (Sourcify)
        continue-on-error: true
        working-directory: contracts
        run: ./script/verificar.sh "$CHAIN"

      - name: Gravar endereços na main
        run: |
          git config user.name "xbrl-deploy[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "wallet/src/deployments/$CHAIN.json"
          git commit -m "Deploy ${{ inputs.rede }}: endereços do protocolo (chainId $CHAIN)" || echo "Nada novo"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Republicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-deploy.yml --ref main

      - name: Devolver o POL que sobrou ao CREATOR_TREASURY
        if: always()
        continue-on-error: true
        run: |
          saldo=$(cast balance "$DEPLOYER" --rpc-url "$RPC")
          preco=$(cast gas-price --rpc-url "$RPC")
          custo=$(echo "21000 * ($preco * 2 + 40000000000)" | bc)
          if [ "$(echo "$saldo > $custo" | bc)" = "1" ]; then
            valor=$(echo "$saldo - $custo" | bc)
            cast send "$TREASURY" --value "$valor" --private-key "$CHAVE" --rpc-url "$RPC" \
              --gas-limit 21000 --gas-price "$(echo "$preco * 2 + 40000000000" | bc)"
            echo "Devolvido: $(cast from-wei "$valor") POL"
          fi

      - name: Fechar o aviso
        if: always() && env.ISSUE_URL != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "$ISSUE_URL" -R "$GITHUB_REPOSITORY" --comment "Execução terminou: ${{ job.status }}. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
