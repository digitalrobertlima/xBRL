[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10_000
via_ir = false
deny = "warnings"
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../wallet/src/deployments" }]

[lint]
exclude_lints = ["asm-keccak256"]

[fuzz]
runs = 512
seed = "0x78425256"

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
polygon = "${POLYGON_RPC_URL}"
amoy = "${AMOY_RPC_URL}"

[fmt]
line_length = 110
